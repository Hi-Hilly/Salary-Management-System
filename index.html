<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Salary Management System</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <!-- LOGIN PAGE -->

  <div id="loginPage" class="login-page">

    <div class="login-box">

      <h1>Salary Management System</h1>

      <input
        type="password"
        id="adminPassword"
        placeholder="Enter Admin Password"
      >

      <button onclick="loginAdmin()">
        Login as Admin
      </button>

      <button onclick="openUserDashboard()">
        Continue as User
      </button>

    </div>

  </div>

  <!-- USER DASHBOARD -->

  <div id="userDashboard" class="hidden">

    <header class="header">

      <h1>User Dashboard</h1>

      <button onclick="backToLogin()">
        Logout
      </button>

    </header>

    <div class="content">

      <div class="search-box">

        <input
          type="number"
          id="searchId"
          placeholder="Search Employee ID"
        >

        <button onclick="searchEmployee()">
          Search Employee
        </button>

      </div>

      <h2>Employee List</h2>

      <div
        id="userEmployeeList"
        class="employee-grid"
      ></div>

    </div>

  </div>

  <!-- ADMIN DASHBOARD -->

  <div id="adminDashboard" class="hidden">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <h2>Admin Panel</h2>

      <button onclick="showSection('addSection')">
        Add Employee
      </button>

      <button onclick="showSection('manageSection')">
        Manage Employees
      </button>

      <button onclick="showSection('statisticsSection')">
        Statistics
      </button>

      <button onclick="logoutAdmin()">
        Logout
      </button>

    </aside>

    <!-- MAIN CONTENT -->

    <main class="main-content">

      <h1>Salary Management System</h1>

      <!-- ADD EMPLOYEE -->

      <section
        id="addSection"
        class="dashboard-section"
      >

        <h2>Add Employee</h2>

        <div class="form-container">

          <input
            type="number"
            id="id"
            placeholder="Employee ID"
          >

          <input
            type="text"
            id="name"
            placeholder="Employee Name"
          >

          <input
            type="number"
            id="hours"
            placeholder="Hours Worked"
          >

          <input
            type="number"
            id="rate"
            placeholder="Hourly Rate"
          >

          <select id="role">

            <option value="STAFF">
              Staff
            </option>

            <option value="MANAGER">
              Manager
            </option>

            <option value="INTERN">
              Intern
            </option>

          </select>

          <button onclick="addEmployee()">
            Add Employee
          </button>

        </div>

      </section>

      <!-- MANAGE EMPLOYEE -->

      <section
        id="manageSection"
        class="dashboard-section hidden"
      >

        <h2>Manage Employees</h2>

        <div
          id="adminEmployeeList"
          class="employee-grid"
        ></div>

      </section>

      <!-- STATISTICS -->

      <section
        id="statisticsSection"
        class="dashboard-section hidden"
      >

        <h2>Salary Statistics</h2>

        <div class="stats-grid">

          <div class="stat-card">

            <h3>Highest Salary</h3>

            <p id="highestSalary">0</p>

          </div>

          <div class="stat-card">

            <h3>Lowest Salary</h3>

            <p id="lowestSalary">0</p>

          </div>

          <div class="stat-card">

            <h3>Average Salary</h3>

            <p id="averageSalary">0</p>

          </div>

        </div>

      </section>

    </main>

  </div>

  <!-- FIREBASE SCRIPT -->

  <script
    type="module"
    src="script.js"
  ></script>

</body>

</html>
